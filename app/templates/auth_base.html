<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}TERA Service Performance Monitoring System{% endblock %}</title>
        <link rel="icon" href="/static/img/tera-icon.png" type="image/x-icon" />
        <link rel="stylesheet" href="/static/css/style.css" />
        <link rel="stylesheet" href="/static/css/loading.css" />
        <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        />
    </head>
    <body class="auth-page">
        <div class="auth-wrapper">
            <div class="auth-card shadow-sm">
                <div class="text-center mb-4">
                    <img
                    src="{{ url_for('static', path='img/tera-logo.jpg') }}"
                    height="40"
                    alt="TERA Logo"
                    />
                    <p class="text-muted mb-0">Service Performance Monitoring System</p>
                </div>

                {% block content %}{% endblock %}
            </div>
        </div>
        <footer class="app-footer text-center">
            Copyright © 2026 | All Rights Reserved.
        </footer>
        <script src="/static/js/loading.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
