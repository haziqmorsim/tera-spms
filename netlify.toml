[build]
  base = "frontend"
  publish = "."
  command = ""

# Proxy API calls to the FastAPI backend on Render.
[[redirects]]
  from = "/api/*"
  to = "https://tera-spms.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/reports"
  to = "/reports/index.html"
  status = 200

[[redirects]]
  from = "/logs"
  to = "/logs/index.html"
  status = 200

[[redirects]]
  from = "/settings"
  to = "/settings/index.html"
  status = 200