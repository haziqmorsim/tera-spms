{% extends "auth_base.html" %}

{% block content %}
<h4 class="mb-3">Reset Password</h4>

{% if error %}
<div class="alert alert-danger" role="alert">{{ error }}</div>
{% endif %}

{% if not token_valid %}
<div class="alert alert-warning" role="alert">The reset link is invalid, expired, or has been used.</div>

<p class="text-center mb-0">
    <a href="/forgot-password">Request a new reset link</a>
</p>
{% else %}
<form action="/reset-password" method="post" id="resetPasswordForm">
    <input type="hidden" id="token" name="token" value="{{ token }}" />

    <div class="mb-3">
        <label for="password" class="form-label">New Password</label>
        <input type="password" name="password" id="password" class="form-control" required autocomplete="new-password" />
        <div class="form-text">Password must be at least 8 characters.</div>
    </div>

    <div class="mb-3">
        <label for="confirm_password" class="form-label">Confirm Password</label>
        <input type="password" name="confirm_password" id="confirm_password" class="form-control" required autocomplete="new-password" />
    </div>

    <button type="submit" class="btn btn-primary w-100 mb-3 sign-button">Reset Password</button>
</form>
{% endif %}

<script src="/static/js/reset_password.js"></script>
{% endblock %}
