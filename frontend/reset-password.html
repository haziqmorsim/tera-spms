<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Reset Password | TERA SPMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/static/img/tera-icon.png" />
    <link rel="stylesheet" href="/static/css/style.css" />
    <link rel="stylesheet" href="/static/css/loading.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  </head>
  <body>
    <div class="container d-flex align-items-center justify-content-center min-vh-100">
      <div class="card shadow-sm" style="width: 420px;">
        <div class="card-body">
          <div class="text-center mb-3">
            <img src="/static/img/tera-logo.jpg" alt="TERA Logo" style="height: 56px;" />
          </div>

          <h4 class="mb-3">Reset Password</h4>
          <div id="authAlert"></div>

          <form id="resetPasswordForm">
            <div class="mb-3">
              <label for="password" class="form-label">New Password</label>
              <input type="password" class="form-control" id="password" required autocomplete="new-password" />
            </div>

            <div class="mb-3">
              <label for="confirm_password" class="form-label">Confirm New Password</label>
              <input type="password" class="form-control" id="confirm_password" required autocomplete="new-password" />
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3">
              Reset Password
            </button>

            <p class="text-center mb-0">
              <a href="/signin.html">Back to Sign In</a>
            </p>
          </form>
        </div>
      </div>
    </div>

    <script src="/static/js/loading.js"></script>
    <script src="/static/js/api-client.js"></script>
    <script src="/static/js/frontend-auth.js"></script>
    <script src="/static/js/frontend-reset-password.js"></script>
  </body>
</html>
